  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "README Studio",
      "url": "https://readme.alexistb.com/",
      "description": "A local-first visual editor for creating polished, GitHub-ready README profiles.",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "Web",
      "browserRequirements": "Requires JavaScript and a modern web browser",
      "isAccessibleForFree": true,
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "author": {
        "@type": "Person",
        "name": "Alexis Thierry-Bellefond"
      }
    }
  </script>
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const path = params.get("ghPagesPath");

      if (!path || !path.startsWith("/") || path.startsWith("//") || path.includes("\\")) return;

      const search = params.get("ghPagesSearch") || "";
      const hash = params.get("ghPagesHash") || "";
      const basePath = "%BASE_URL%".replace(/\/$/, "");
      const normalizedPath = new URL(path, window.location.origin).pathname;

      window.history.replaceState(null, "", `${basePath}${normalizedPath}${search}${hash}`);
    })();
  </script>
  <title>README Studio · Build a GitHub README that feels like you</title>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
