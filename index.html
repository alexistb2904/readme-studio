<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#06142b" />
  <meta name="description" content="A local-first visual editor for thoughtful, GitHub-ready README profiles." />
  <meta name="robots" content="index,follow" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="README Studio" />
  <meta property="og:title" content="README Studio · Build a GitHub README that feels like you" />
  <meta property="og:description" content="A local-first visual editor for thoughtful, GitHub-ready README profiles." />
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const path = params.get("ghPagesPath");

      if (!path || !path.startsWith("/") || path.startsWith("//") || path.includes("\\")) return;

      const search = params.get("ghPagesSearch") || "";
      const hash = params.get("ghPagesHash") || "";
      const basePath = "%BASE_URL%".replace(/\/$/, "");
      const normalizedPath = new URL(path, window.location.origin).pathname;

      window.history.replaceState(null, "", `${basePath}${normalizedPath}${search}${hash}`);
    })();
  </script>
  <title>README Studio · Build a GitHub README that feels like you</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
