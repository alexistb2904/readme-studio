<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex" />
  <title>Redirecting…</title>
  <script>
    (() => {
      const params = new URLSearchParams({
        ghPagesPath: window.location.pathname || "/",
        ghPagesSearch: window.location.search,
        ghPagesHash: window.location.hash,
      });

      window.location.replace(`/?${params.toString()}`);
    })();
  </script>
</head>

<body></body>

</html>
