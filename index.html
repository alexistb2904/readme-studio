  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is a GitHub profile README?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "It is the README.md file from a public repository whose name matches your GitHub username. GitHub displays it at the top of your profile."
          }
        },
        {
          "@type": "Question",
          "name": "Is README Studio free?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. README Studio runs in your browser and does not require an account to create, preview or export a README."
          }
        },
        {
          "@type": "Question",
          "name": "Can I edit the generated README later?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. The exported README.md is regular Markdown and GitHub-supported HTML, so you can edit it in GitHub or any code editor."
          }
        }
      ]
    }
  </script>
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const path = params.get("ghPagesPath");

      if (!path || !path.startsWith("/") || path.startsWith("//") || path.includes("\\")) return;

      const search = params.get("ghPagesSearch") || "";
      const hash = params.get("ghPagesHash") || "";
      const basePath = "%BASE_URL%".replace(/\/$/, "");
      const normalizedPath = new URL(path, window.location.origin).pathname;

      window.history.replaceState(null, "", `${basePath}${normalizedPath}${search}${hash}`);
    })();
  </script>
  <title>GitHub README Generator | README Studio</title>
